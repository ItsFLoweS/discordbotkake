[package]
name = "dbk"
version = "0.1.0"
description = "Discord Bot Kit by ItsFloweS"
authors = ["ItsFloweS"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
